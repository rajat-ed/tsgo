<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dcdcdc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TS_GO!</title>
<style>
:root{--a:#6c8cff;--a2:#b06cff;--bg:#0e1015;--field:#262b3a;--ghost:#3a3f50;--ink:#e8eaf0;--dim:#8b90a0;--rec:#ff5555;--sheet:rgba(23,26,34,.97);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none;touch-action:manipulation;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
svg.i{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}

#cv{position:fixed;inset:0;width:100%;height:100dvh;object-fit:cover;background:var(--bg);z-index:0}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .2s}
#ui>*{pointer-events:auto}
#ui .none{pointer-events:none}

/* top bar */
#top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;align-items:center;justify-content:space-between;height:calc(var(--sat) + 56px);pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.logo{font-family:Impact,"Arial Black",sans-serif;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#recChip{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:99px;font-variant-numeric:tabular-nums;font-size:15px;pointer-events:none}
#recChip i{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}

/* right rail */
#rail{position:absolute;right:6px;top:calc(var(--sat) + 84px);display:flex;flex-direction:column;gap:16px;align-items:center}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:4px 0;font-size:11px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.rb:active svg{transform:scale(.88)}
.rb.on svg{stroke:var(--a2)}
.rb.spin svg{animation:sp .5s}
@keyframes sp{to{transform:rotate(360deg)}}

/* bottom */
#bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(var(--sab) + 10px);background:linear-gradient(transparent,rgba(0,0,0,.55) 45%)}
#presets{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px calc(50% - 34px) 8px;scrollbar-width:none}
#presets::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:center;font-size:11px;text-shadow:0 1px 4px #000;opacity:.8}
.pc .em{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.16);border:2px solid transparent;transition:.15s}
.pc.on{opacity:1}.pc.on .em{border-color:#fff;background:rgba(255,255,255,.28);transform:scale(1.12)}
.pc .nm{white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
#ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 20px 0}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;width:64px;text-shadow:0 1px 4px #000}
.side.r{justify-self:end}.side.l{justify-self:start}
.sq{width:38px;height:38px;border-radius:10px;border:2px solid #fff;display:grid;place-items:center;font-size:20px;background:rgba(0,0,0,.3)}
.sq svg.i{width:22px;height:22px;filter:none}
#bRec{position:relative;width:84px;height:84px;display:grid;place-items:center}
#bRec svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#bRec .ringBg{fill:none;stroke:#fff;stroke-width:5;opacity:.95}
#bRec .ringFg{fill:none;stroke:var(--a2);stroke-width:5;stroke-linecap:round;stroke-dasharray:238.76;stroke-dashoffset:238.76;opacity:0}
#bRec i{display:block;width:62px;height:62px;border-radius:50%;background:var(--rec);transition:.2s}
#bRec:active i{transform:scale(.9)}
body.recording #bRec .ringBg{stroke:rgba(255,255,255,.35)}
body.recording #bRec .ringFg{opacity:1}
body.recording #bRec i{width:30px;height:30px;border-radius:8px}
body.recording #rail,body.recording #presets,body.recording .side,body.recording #btnClose{opacity:0;pointer-events:none}
body:not(.recording) #recChip{display:none}
body:not(.filemode) #btnClose{visibility:hidden}
body.filemode #rFlip{opacity:.35;pointer-events:none}

/* toast */
#toast{position:absolute;left:50%;top:26%;transform:translate(-50%,0);max-width:80%;text-align:center;font-size:22px;font-weight:800;
  text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .25s}
#toast small{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:2px}
#toast.show{opacity:1}

/* sheets */
#shade{position:fixed;inset:0;z-index:20}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:20px 20px 0 0;padding:8px 16px calc(var(--sab) + 18px);max-height:48dvh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;
  overscroll-behavior:contain}
#panel.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:4px auto 10px}
#panel h3{font-size:16px;text-align:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--field);border:2px solid transparent;font-size:12px}
.tile .em{font-size:28px}
.tile.on{border-color:var(--a);background:rgba(108,140,255,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:99px;background:var(--field);font-size:13px;border:2px solid transparent}
.chip.on{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff}
.lbl{font-size:12px;color:var(--dim);margin:6px 0 8px;letter-spacing:.5px;text-transform:uppercase}
.sl{margin-bottom:12px}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.sl b{color:var(--a);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--ghost)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--ghost)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10.5px;box-shadow:0 1px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.08)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--ghost);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on .sw{background:linear-gradient(90deg,var(--a),var(--a2))}.tg.on .sw::after{left:23px}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 10px}
.step button{width:44px;height:44px;border-radius:50%;background:var(--field);font-size:22px}
.step span{min-width:64px;text-align:center;font-size:15px}

/* full-screen overlays */
.full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#splash{z-index:40;background:radial-gradient(1200px 600px at 20% -10%,#1b2140,var(--bg));gap:14px;overflow:auto}
#splash h1{font-size:60px}
#splash p{color:var(--dim);font-size:15px;max-width:290px;font-weight:500}
.cta{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;font-weight:800;font-size:17px;padding:15px 38px;border-radius:99px;min-width:220px}
.alt{background:var(--ghost);font-weight:700;font-size:15px;padding:13px 30px;border-radius:99px;min-width:220px;text-decoration:none;color:#fff;display:inline-block}
#splashMsg{min-height:1.2em;color:#ff6b6b;font-size:14px;max-width:290px;font-weight:600}
#result{z-index:30;background:var(--bg);gap:12px;justify-content:flex-start;padding-top:calc(var(--sat) + 16px);padding-bottom:calc(var(--sab) + 16px)}
#result video{flex:1;min-height:0;max-width:100%;border-radius:14px;background:#111}
#result .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
#result small{color:var(--dim);font-weight:500;font-size:12px;word-break:break-all;text-align:center}
#gate{z-index:60;background:var(--bg);gap:12px}
#gate h2{font-size:24px}
#gate p{color:var(--dim);font-weight:500;max-width:320px}

/* ---------- 8-bit gray theme (the pixel look of the original Traffic Symphony) ---------- */
:root{--bg:#dcdcdc;--ink:#222;--dim:#555;--field:#e4e4e4;--ghost:#c8c8c8;--rec:#ff5555;--sheet:#c8c8c8;
  --bevel:inset 2px 2px 0 #fff,inset -2px -2px 0 #888;--press:inset 2px 2px 0 #777,inset -2px -2px 0 #e0e0e0;
  --sunk:inset 2px 2px 0 #666,inset -2px -2px 0 #bbb;--drop:3px 3px 0 rgba(0,0,0,.45)}
*{border-radius:0!important;font-family:"Courier New",Courier,monospace!important;letter-spacing:.5px}
html,body{font-weight:700;text-transform:uppercase}
svg.i{stroke-linecap:square;stroke-linejoin:miter;stroke-width:2.5;filter:none}
#cv{image-rendering:pixelated}
button:focus-visible{outline:3px dashed #3a3a3a;outline-offset:2px}
button:disabled{opacity:.55}
button,input,select{text-transform:inherit}
.tile.on{border-color:#3a3a3a}
/* gray bevel buttons */
.rb,.sq,.ib,#bRec,.pc .em,.chip,.tile,.step button,.cta,.alt,#recChip{background:#c8c8c8;color:#222;border:2px solid #3a3a3a;box-shadow:var(--bevel)}
.rb,.sq,#bRec,.pc .em,.cta,.alt{box-shadow:var(--bevel),var(--drop)}
.rb:active,.sq:active,.ib:active,#bRec:active,.chip:active,.tile:active,.step button:active,.cta:active,.alt:active{background:#b4b4b4;box-shadow:var(--press)}
.ib.none{background:none;border:0;box-shadow:none}
.ib svg.i{stroke:#222}
.rb{width:58px;padding:5px 0 3px;gap:1px;font-size:9px;font-weight:700;text-shadow:none}
.rb svg.i{width:24px;height:24px}
.rb.on{background:#9a9a9a;box-shadow:var(--sunk)}
.rb.on svg{stroke:#222}
.rb:active svg{transform:none}
.rb.spin svg{animation:sp .5s steps(6)}
#rail{gap:12px}
#bottom{background:linear-gradient(transparent,rgba(0,0,0,.5) 40%)}
.pc{opacity:1;font-size:9px}
.pc .em{filter:grayscale(1) contrast(1.1)}
.pc.on .em{background:#9a9a9a;box-shadow:var(--sunk);border-color:#fff;outline:2px solid #3a3a3a;transform:none}
.pc .nm,.side span{color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000;max-width:72px}
.side{color:#fff;font-size:10px;text-shadow:none}
.sq svg.i{stroke:#222}
#instEm{filter:grayscale(1) contrast(1.1)}
#bRec{background:#c8c8c8;border-width:3px;box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.45)}
#bRec svg.ring{transform:none}
#bRec .ringFg{fill:none;stroke:var(--rec);stroke-width:5;stroke-linecap:butt;stroke-dasharray:296;stroke-dashoffset:296;opacity:0}
#bRec i{width:50px;height:50px;background:var(--rec);border:3px solid #3a3a3a;transition:none}
#bRec:active i{transform:none}
body.recording #bRec i{width:26px;height:26px}
#recChip{padding:4px 12px;font-size:14px;gap:8px}
#recChip i{border-radius:0;width:12px;height:12px;border:2px solid #3a3a3a}
#toast{background:#c8c8c8;color:#222;border:3px solid #3a3a3a;box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.45);padding:10px 16px;text-shadow:none;font-size:16px;font-weight:700;letter-spacing:1px}
#toast small{font-size:11px;font-weight:700;opacity:1;color:#555}
/* sheets */
#panel{background:#c8c8c8;color:#222;border:3px solid #3a3a3a;border-bottom:0;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #888;backdrop-filter:none;-webkit-backdrop-filter:none}
.grab{background:#3a3a3a;height:4px}
#panel h3{letter-spacing:3px}
.tile{padding:10px 4px;font-size:10px;gap:2px}
.tile .em{filter:grayscale(1) contrast(1.1)}
.tile.on,.chip.on{background:#9a9a9a;color:#222;box-shadow:var(--sunk)}
.chip{padding:6px 12px;font-size:12px}
.lbl{color:#555}
.sl label{font-size:12px}.sl b{color:#222}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#3a3a3a}
input[type=range]::-moz-range-track{height:6px;background:#3a3a3a}
input[type=range]::-webkit-slider-thumb{width:22px;height:28px;background:#c8c8c8;border:2px solid #3a3a3a;box-shadow:var(--bevel);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:22px;height:28px;background:#c8c8c8;border:2px solid #3a3a3a;box-shadow:var(--bevel)}
.tg{border-top:2px dashed #888;font-size:12px}
.sw{width:52px;height:28px;background:#e4e4e4;border:2px solid #3a3a3a;box-shadow:inset 2px 2px 0 #888;transition:none}
.sw::after{width:16px;height:16px;top:4px;left:4px;background:#3a3a3a;transition:none}
.tg.on .sw{background:#9a9a9a}.tg.on .sw::after{left:28px}
.step span{font-size:14px}
/* full-screen overlays */
#splash,#gate,#result{background:#dcdcdc;color:#222}
#splash h1,#gate h1,.logo{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#222;-webkit-text-fill-color:#222;font-size:52px;font-weight:900;letter-spacing:6px;text-shadow:4px 4px 0 #888}
#splash p,#gate p{color:#555;font-size:13px}
.cta,.alt{padding:13px 28px;font-size:14px;font-weight:700;letter-spacing:1px}
#splashMsg{color:#222;font-size:12px}
#result video{border:3px solid #3a3a3a;background:#000}
#result small{color:#555;font-size:11px}

/* ---------- landscape: controls move to the sides so the picture stays wide ---------- */
@media (orientation:landscape){
  #top{height:calc(var(--sat) + 52px);padding:calc(var(--sat) + 6px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px)}
  #rail{flex-direction:row;gap:4px;top:calc(var(--sat) + 6px);right:calc(var(--sar) + 120px)}
  .rb{width:46px;font-size:0;gap:0;padding:4px 0}
  #splash h1{font-size:34px}
  #bottom{right:calc(var(--sar) + 112px);padding-bottom:calc(var(--sab) + 4px)}
  #presets{padding:4px calc(50% - 28px) 4px;gap:10px}
  .pc{width:58px;font-size:10px;gap:2px}
  .pc .em{width:40px;height:40px;font-size:20px}
  .pc .nm{max-width:58px}
  #ctrl{position:fixed;right:calc(var(--sar) + 18px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;align-items:center;padding:0}
  #ctrl #bInst{order:1}#ctrl #bRec{order:2}#ctrl #bUpload{order:3}
  #bRec{width:76px;height:76px}#bRec i{width:44px;height:44px}
  body.recording #bRec i{width:24px;height:24px}
  .side{width:60px;gap:2px}.sq{width:34px;height:34px}
  #toast{top:20%;font-size:19px}
  #panel{left:auto;top:0;bottom:0;width:min(50vw,430px);max-height:none;border-radius:20px 0 0 20px;transform:translateX(105%);
    padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) 16px}
  #panel.open{transform:none}
  .grab{display:none}
  #splash{gap:8px;padding:10px 24px}#splash h1{font-size:36px}#splash p{font-size:13px;max-width:440px}
  .cta{padding:11px 30px;font-size:16px;min-width:200px}.alt{padding:10px 24px;font-size:14px;min-width:200px}
  #result{flex-direction:row;justify-content:center;align-items:stretch;gap:16px;
    padding:calc(var(--sat) + 10px) calc(var(--sar) + 16px) calc(var(--sab) + 10px) calc(var(--sal) + 16px)}
  #result video{flex:1;min-width:0;max-width:none}
  #result .btns{width:270px;flex:none;justify-content:center}
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Camera with musical zones"></canvas>

<div id="ui">
  <div id="top">
    <div class="ib none"></div>
    <div id="recChip"><i></i><span id="recTime">0:00</span></div>
    <button class="ib" id="btnClose" aria-label="Back to camera"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div id="rail">
    <button class="rb" id="rFlip" aria-label="Flip camera"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>Flip</button>
    <button class="rb" id="rScale" aria-label="Scale and key"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h4v-4h4v-4h4V8h4V4h2"/></svg>Scale</button>
    <button class="rb" id="rMix" aria-label="Mix settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Mix</button>
    <button class="rb" id="rChord" aria-label="Chords"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Chords</button>
  </div>

  <div id="toast"></div>

  <div id="bottom">
    <div id="presets" role="listbox" aria-label="Presets"></div>
    <div id="ctrl">
      <button class="side l" id="bUpload" aria-label="Upload a video"><div class="sq"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg></div>Upload</button>
      <button id="bRec" aria-label="Record"><svg class="ring" viewBox="0 0 84 84"><rect class="ringFg" id="ringFg" x="5" y="5" width="74" height="74"/></svg><i></i></button>
      <button class="side r" id="bInst" aria-label="Choose instrument"><div class="sq" id="instEm">&#127929;</div><span id="instNm">Piano</span></button>
    </div>
  </div>
</div>

<div id="shade" hidden></div>
<div id="panel" role="dialog" aria-modal="true"><div class="grab"></div><h3 id="shTitle"></h3><div id="shBody"></div></div>

<div id="splash" class="full">
  <h1 class="logo">TS_GO!</h1>
  <p>Wave your hands. Dance. Walk by. Everything that moves plays music.</p>
  <button class="cta" id="btnGo">Tap to start</button>
  <button class="alt" id="btnSplashVid">Use a video file</button>
  <div id="splashMsg" role="status"></div>
</div>

<div id="result" class="full" hidden>
  <video id="resVid" controls playsinline></video>
  <div class="btns">
    <small id="resNote"></small>
    <a class="cta" id="rSave">Save</a>
    <button class="alt" id="rShare" hidden>Share</button>
    <button class="alt" id="rBack">Back to camera</button>
  </div>
</div>

<input type="file" id="fileIn" accept="video/*,.mp4,.mov,.webm,.mkv" hidden>

<div id="gate" class="full" hidden><h1 class="logo" style="font-size:48px">TS_GO!</h1><h2>Made for smartphones</h2><p>Open this page on your phone to play and record.</p></div>

<script>
(() => {
  // ---------- Phones only ----------

      ctx.fillStyle = `rgba(255,255,255,${m ? .03 : .08 + glow[i] * .6})`; ctx.fillRect(x0, ROI_Y, x1 - x0, RH);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x0, ROI_Y, 1, RH);
      ctx.fillStyle = m ? 'rgba(255,255,255,.35)' : '#fff'; ctx.fillText(m ? '✕' : (names[i] || ''), (x0 + x1) / 2, ROI_Y + 42);
    }
    ctx.fillStyle = '#fff'; ctx.fillRect(zx0, ROI_Y - 2, zw, 4);   // trigger line

    // sparkles
    parts = parts.filter(p => p.l > 0);
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.l -= dt * 1.3;
      const l = Math.max(0, p.l), ps = 4 + Math.round(8 * l); ctx.fillStyle = `rgba(255,255,255,${l})`; ctx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, ps, ps);   // chunky pixels
    }

    // live waveform
    an.getFloatTimeDomainData(scope);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let j = 0; j < 1024; j += 4) { const x = zx0 + j / 1023 * zw, y = ROI_Y - 90 + scope[j] * 150; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();

    // TS_GO! logo, top left, as a gray 8-bit button. Drawn last on the canvas, so it is in every exported frame.
    const MONO = '"Courier New",Courier,monospace';
    ctx.font = '900 46px ' + MONO; ctx.textAlign = 'left';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '4px';
    const lw = ctx.measureText('TS_GO!').width, lx = 34 + safeL, ly = 100, bw = Math.round(lw + 44), bh = 72, bx = lx - 22, by = ly - 52;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(bx + 5, by + 5, bw, bh);          // hard drop shadow
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(bx, by, bw, bh);                          // border
    ctx.fillStyle = '#c8c8c8'; ctx.fillRect(bx + 4, by + 4, bw - 8, bh - 8);          // face
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + 4, by + 4, bw - 8, 4); ctx.fillRect(bx + 4, by + 4, 4, bh - 8);   // bevel light
    ctx.fillStyle = '#888'; ctx.fillRect(bx + 4, by + bh - 8, bw - 8, 4); ctx.fillRect(bx + bw - 8, by + 4, 4, bh - 8);   // bevel dark
    ctx.fillStyle = '#222'; ctx.fillText('TS_GO!', lx, ly - 6);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '1px';
    ctx.font = '700 24px ' + MONO;
    const info = (S.inst + ' \u00b7 ' + S.scale + ' in ' + S.key).toUpperCase(), ix = bx, iy = by + bh + 36;
    ctx.fillStyle = '#000'; for (const [ox, oy] of [[2,0],[-2,0],[0,2],[0,-2]]) ctx.fillText(info, ix + ox, iy + oy);   // pixel outline
    ctx.fillStyle = '#fff'; ctx.fillText(info, ix, iy);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  // ---------- Recording / export ----------
  function pickMime() {
    const l = ['video/x-matroska;codecs=avc1,opus','video/x-matroska;codecs=avc1','video/x-matroska','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4;codecs=avc1,mp4a.40.2','video/mp4'];
    return l.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }
  // Rewrites a WebM file's EBML header as Matroska (WebM is a Matroska subset, so the rest is untouched)
  async function toMatroska(blob) {
    const u = new Uint8Array(await blob.slice(0, 64).arrayBuffer());
    if (u[0] !== 0x1A || u[1] !== 0x45 || u[2] !== 0xDF || u[3] !== 0xA3) return null;
    let n = 1; while (n < 8 && !(u[4] & (0x80 >> (n - 1)))) n++;
    let v = u[4] & (0xFF >> n); for (let i = 1; i < n; i++) v = v * 256 + u[4 + i];
    const oldLen = 4 + n + v, dt = [...'matroska'].map(c => c.charCodeAt(0));
    const hdr = new Uint8Array([0x1A,0x45,0xDF,0xA3, 0xA3,
      0x42,0x86,0x81,0x01, 0x42,0xF7,0x81,0x01, 0x42,0xF2,0x81,0x04, 0x42,0xF3,0x81,0x08,
      0x42,0x82,0x88, ...dt, 0x42,0x87,0x81,0x04, 0x42,0x85,0x81,0x02]);
    return new Blob([hdr, blob.slice(oldLen)], { type: 'video/x-matroska' });
  }
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function updateRec() {
    const t = (performance.now() - recStart) / 1000;
    $('recTime').textContent = fmt(t);
    $('ringFg').style.strokeDashoffset = String(296 * (1 - Math.min(1, t / CAP)));
    if (t >= CAP) stopRec();
  }
  function startRec() {
    recMime = pickMime();
    if (!recMime) { toast('Recording is not supported in this browser', '', 2500); return; }
    if (!actx) return;
    chunks = [];
    try {
      const ms = new MediaStream([...cv.captureStream(FPS).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
      recorder = new MediaRecorder(ms, { mimeType: recMime, videoBitsPerSecond: 5e6 });
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.start(250);
    } catch (e) { recorder = null; toast('Could not start recording', String(e.message || e), 3000); return; }
    closeSheet(); recStart = performance.now(); body.classList.add('recording'); buzz(20);
    updateRec(); recTimer = setInterval(updateRec, 200);
  }
  function stopRec() {
    if (!recorder || $('bRec').disabled) return;
    clearInterval(recTimer); $('bRec').disabled = true; buzz(20);
    setTimeout(() => {                                    // let the last notes and reverb ring out
      const rec = recorder;
      rec.onstop = () => showResult(rec).catch(() => resetRec());
      try { rec.requestData(); } catch (e) {}
      try { rec.stop(); } catch (e) { resetRec(); }
    }, 800);
  }
  function resetRec() { body.classList.remove('recording'); $('bRec').disabled = false; $('ringFg').style.strokeDashoffset = '296'; recorder = null; paused = false; if (layoutPending) applyLayout(); }
  function freeUrls() { blobUrls.forEach(u => URL.revokeObjectURL(u)); blobUrls = []; }
  let shareFile = null;
  async function showResult(rec) {
    const type = (rec.mimeType || recMime || 'video/webm').split(';')[0];
    const raw = new Blob(chunks, { type });
    resetRec();
    if (!raw.size) { toast('Recording was empty', 'Please try again', 2500); return; }
    let out = raw, ext = type.includes('mp4') ? 'mp4' : 'mkv', note = '';
    if (type.includes('webm')) { try { out = (await toMatroska(raw)) || raw; } catch (e) { out = raw; } }
    else if (type.includes('mp4')) note = ' This browser only records MP4, which plays on every phone.';
    freeUrls();
    const url = URL.createObjectURL(raw), dlUrl = URL.createObjectURL(out); blobUrls.push(url, dlUrl);
    const name = `TS_GO_${Math.floor(Date.now() / 1000)}.${ext}`;
    paused = true;                                        // no notes while you review the clip
    $('resVid').src = url; $('rSave').href = dlUrl; $('rSave').download = name; $('rSave').textContent = 'Save ' + ext.toUpperCase();
    $('resNote').textContent = `${name} (${(out.size / 1048576).toFixed(1)} MB).${note}`;
    shareFile = null; $('rShare').hidden = true;
    try {
      const f = new File([out], name, { type: out.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { shareFile = f; $('rShare').hidden = false; }
    } catch (e) {}
    $('result').hidden = false; $('ui').style.opacity = 0; $('ui').style.pointerEvents = 'none';
  }
  function closeResult() {
    $('result').hidden = true; const rv = $('resVid'); rv.pause(); rv.removeAttribute('src'); rv.load(); freeUrls();
    $('ui').style.opacity = ''; $('ui').style.pointerEvents = ''; paused = false; hasPrev = false;
    if (actx && actx.state !== 'running') actx.resume();
  }

  // ---------- UI ----------
  let toastT = 0;
  function toast(title, sub, ms) {
    const t = $('toast'); t.innerHTML = ''; t.append(document.createTextNode(title));
    if (sub) { const s = document.createElement('small'); s.textContent = sub; t.append(s); }
    t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 1400);
  }
  function showSplash(msg) { $('splashMsg').textContent = msg || ''; $('splash').hidden = false; }

  // presets tray
  const tray = $('presets');
  Object.keys(PRE).forEach(n => {
    const b = document.createElement('button'); b.className = 'pc'; b.dataset.n = n; b.setAttribute('role', 'option');
    b.innerHTML = `<div class="em">${PRE[n].em}</div><div class="nm"></div>`; b.querySelector('.nm').textContent = n; tray.appendChild(b);
  });
  tray.addEventListener('click', e => {
    const b = e.target.closest('.pc'); if (!b) return;
    const n = b.dataset.n, p = PRE[n]; buzz(10);
    for (const k in p) if (k !== 'em') S[k] = p[k];
    S.preset = n; save(); applyMix(); refresh(); rebuildSoon();
    b.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
    toast(p.em + ' ' + n, p.inst + ' · ' + p.scale + ' in ' + p.key, 1500);
  });

  // sheets
  const REBUILD = new Set(['inst','scale','key','oct','chord','seg','zone']);
  const syncers = [];
  function onSet(key) {
    if (['inst','scale','key','oct','chord','q'].includes(key)) S.preset = '';
    save(); applyMix();
    if (key === 'spd' && !isCam) { rate = S.spd; video.playbackRate = rate; }
    if (REBUILD.has(key)) rebuildSoon();
    refresh();
  }
  function refresh() {
    document.querySelectorAll('.pc').forEach(b => b.classList.toggle('on', b.dataset.n === S.preset));
    $('instEm').textContent = INST_EM[S.inst]; $('instNm').textContent = S.inst;
    $('rChord').classList.toggle('on', S.chord);
    syncers.forEach(f => f());
  }
  function mk(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function chipRow(parent, items, key, cls) {
    const row = mk('div', 'chips'); parent.appendChild(row);
    items.forEach(v => { const c = mk('button', 'chip'); c.textContent = v; c.addEventListener('click', () => { buzz(8); S[key] = v; onSet(key); }); row.appendChild(c); });
    syncers.push(() => [...row.children].forEach((c, i) => c.classList.toggle('on', items[i] === S[key])));
  }
  function slider(parent, key, label, min, max, step, unit) {
    const w = mk('div', 'sl', `<label><span>${label}</span><b></b></label>`), inp = document.createElement('input'), b = w.querySelector('b');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; w.appendChild(inp); parent.appendChild(w);
    inp.addEventListener('input', () => { S[key] = +inp.value; b.textContent = S[key] + (unit || ''); onSet(key); });
    syncers.push(() => { inp.value = S[key]; b.textContent = S[key] + (unit || ''); });
  }
  function toggle(parent, key, label) {
    const t = mk('button', 'tg', `<span>${label}</span><i class="sw"></i>`); t.style.width = '100%';
    t.addEventListener('click', () => { buzz(8); S[key] = !S[key]; onSet(key); }); parent.appendChild(t);
    syncers.push(() => t.classList.toggle('on', !!S[key]));
  }
  const SHEETS = {};
  (() => { // instruments
    const d = mk('div'); const g = mk('div', 'grid'); d.appendChild(g);
    Object.keys(INST).forEach(n => { const t = mk('button', 'tile', `<span class="em">${INST_EM[n]}</span><span></span>`); t.lastChild.textContent = n;
      t.addEventListener('click', () => { buzz(10); S.inst = n; onSet('inst'); toast(INST_EM[n] + ' ' + n, '', 1100); }); g.appendChild(t); });
    syncers.push(() => [...g.children].forEach((t, i) => t.classList.toggle('on', Object.keys(INST)[i] === S.inst)));
    SHEETS.inst = ['Instrument', d];
  })();
  (() => { // scale + key
    const d = mk('div'); d.appendChild(mk('div', 'lbl', 'Key')); chipRow(d, KEYS, 'key');
    d.appendChild(mk('div', 'lbl', 'Scale')); chipRow(d, Object.keys(SCALES), 'scale');
    d.appendChild(mk('div', 'lbl', 'Octave'));
    const st = mk('div', 'step', '<button aria-label="Lower octave">&minus;</button><span></span><button aria-label="Higher octave">+</button>');
    const [lo, hi] = st.querySelectorAll('button'), sp = st.querySelector('span');
    lo.addEventListener('click', () => { S.oct = Math.max(-1, S.oct - 1); onSet('oct'); }); hi.addEventListener('click', () => { S.oct = Math.min(2, S.oct + 1); onSet('oct'); });
    syncers.push(() => { sp.textContent = (S.oct > 0 ? '+' : '') + S.oct; }); d.appendChild(st);
    SHEETS.scale = ['Scale & Key', d];
  })();
  (() => { // mix
    const d = mk('div');
    slider(d, 'vol', 'Volume', 0, 100, 1, '%'); slider(d, 'rev', 'Reverb', 0, 100, 1, '%'); slider(d, 'sens', 'Sensitivity', 0, 100, 1, '');
    slider(d, 'seg', 'Notes across the screen', 4, 12, 1, ''); slider(d, 'zone', 'Play zone height', 12, 40, 1, '%');
    slider(d, 'cd', 'Retrigger delay', 80, 800, 10, ' ms');
    d.appendChild(mk('div', 'lbl', 'Beat sync')); chipRow(d, QS, 'q'); slider(d, 'bpm', 'Tempo', 60, 180, 1, ' BPM');
    slider(d, 'spd', 'Video speed (uploaded videos)', .25, 2, .25, 'x');
    toggle(d, 'chord', 'Chords (adds 3rd + 5th)'); toggle(d, 'dyn', 'Dynamics (more motion = louder)');
    const rs = mk('button', 'alt', 'Reset all'); rs.style.cssText = 'width:100%;margin-top:12px';
    rs.addEventListener('click', () => { Object.assign(S, DEF); Object.assign(S, PRE[DEF.preset], { preset: DEF.preset }); delete S.em; save(); applyMix(); refresh(); rebuildSoon(); toast('Settings reset', '', 1200); });
    d.appendChild(rs); SHEETS.mix = ['Mix', d];
  })();
  let openName = '';
  function openSheet(n) {
    if (openName === n) return closeSheet();
    const [title, el] = SHEETS[n]; $('shTitle').textContent = title; const b = $('shBody'); b.innerHTML = ''; b.appendChild(el);
    $('shade').hidden = false; $('panel').classList.add('open'); openName = n; $('panel').scrollTop = 0; buzz(8); refresh();
  }
  function closeSheet() { $('shade').hidden = true; $('panel').classList.remove('open'); openName = ''; }
  $('shade').addEventListener('click', closeSheet);
  $('bInst').addEventListener('click', () => openSheet('inst'));
  $('rScale').addEventListener('click', () => openSheet('scale'));
  $('rMix').addEventListener('click', () => openSheet('mix'));
  $('rChord').addEventListener('click', () => { buzz(10); S.chord = !S.chord; onSet('chord'); toast(S.chord ? 'Chords on' : 'Chords off', '', 900); });

  $('rFlip').addEventListener('click', async () => {
    if (switching || isCam === false) return; switching = true; buzz(10);
    const b = $('rFlip'); b.classList.add('spin'); setTimeout(() => b.classList.remove('spin'), 500);
    S.cam = S.cam === 'Front' ? 'Back' : 'Front'; save();
    try { await openCamera(); toast(S.cam + ' camera', '', 900); } catch (e) { S.cam = S.cam === 'Front' ? 'Back' : 'Front'; toast('Could not switch camera', openErr(e, true), 2500); try { await openCamera(); } catch (e2) {} }
    switching = false;
  });
  $('bRec').addEventListener('click', () => { if (recorder) stopRec(); else startRec(); });
  $('bUpload').addEventListener('click', () => { try { initAudio(); } catch (e) {} $('fileIn').click(); });
  $('btnClose').addEventListener('click', async () => { try { await openCamera(); } catch (e) { toast('Camera unavailable', openErr(e, true), 2500); } });
  $('fileIn').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { initAudio(); applyMix(); if (!bufs.length) await rebuild(); await openFile(f); $('splash').hidden = true; lockScreen(); toast('Video loops until you switch back', '', 2000); }
    catch (err) { const m = openErr(err, false); if (!$('splash').hidden) $('splashMsg').textContent = m; else toast('Cannot play video', m, 3000); }
  });
  $('btnSplashVid').addEventListener('click', () => { try { initAudio(); } catch (e) {} $('fileIn').click(); });
  $('btnGo').addEventListener('click', async () => {
    const btn = $('btnGo'); btn.disabled = true; $('splashMsg').textContent = '';
    try {
      initAudio(); applyMix(); await rebuild(); await openCamera();
      $('splash').hidden = true; lockScreen();
      let seen = false; try { seen = localStorage.getItem('tsgo_hint') === '1'; localStorage.setItem('tsgo_hint', '1'); } catch (e) {}
      if (!seen) toast('Move in the glowing zone', 'Tap a zone to mute it', 3000);
    } catch (e) { $('splashMsg').textContent = openErr(e, true); btn.textContent = 'Try again'; }
    btn.disabled = false;
  });
  $('rSave').addEventListener('click', () => buzz(10));
  $('rShare').addEventListener('click', async () => { if (shareFile) { try { await navigator.share({ files: [shareFile], title: 'TS_GO!' }); } catch (e) {} } });
  $('rBack').addEventListener('click', closeResult);

  // tap a zone to mute / unmute it
  cv.addEventListener('click', e => {
    if (!bufs.length) return;
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (y < ROI_Y || y > ROI_Y + RH || x < zx0 || x >= zx0 + zw) { closeSheet(); return; }
    const i = Math.floor((x - zx0) / (zw / numSeg)); if (i >= 0 && i < numSeg) { muted[i] = !muted[i]; buzz(8); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (actx && actx.state !== 'running') actx.resume();
    if (!wakeLock && $('splash').hidden) lockScreen();
  });
  // Rotating the phone resizes the canvas and re-lays the zones. During a recording the size is frozen (a size change would corrupt the file); it applies when the recording ends.
  function applyLayout() {
    if (recorder) { layoutPending = true; return; }
    layoutPending = false; setCanvasSize(); parts = []; if (actx) rebuild();
  }
  let rsT = 0;
  const onRot = ms => { clearTimeout(rsT); rsT = setTimeout(applyLayout, ms); };
  addEventListener('resize', () => onRot(300));
  addEventListener('orientationchange', () => onRot(450));

  refresh();
  setTimeout(() => { const on = tray.querySelector('.pc.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); }, 0);
})();
</script>
</body>
</html>
